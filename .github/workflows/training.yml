name: Training Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    paths:
      - "wine_quality_training.py"
      - "data/**"
      - "*.dvc"
      - "data/*.dvc"
      - "dvc.yaml"
      - "dvc.lock"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/training.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install project
        run: uv sync --frozen

      - name: Lint code
        run: uv run ruff check . --output-format=github

      - name: Run unit tests
        run: uv run pytest

  security:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Scan dependencies
        run: |
          set -o pipefail
          echo "### 🛡️ Security Audit Results" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          uvx uv-secure --config=pyproject.toml | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```'

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  train:
    name: Train and Track
    runs-on: ubuntu-latest
    needs:
      - lint-and-test
      - security

    env:
      DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      MLFLOW_TRACKING_URI: https://dagshub.com/${{ secrets.DAGSHUB_USERNAME }}/ais-devil2-wine-quality-full.mlflow
      MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install project
        run: uv sync --frozen

      - name: Configure DVC credentials
        run: |
          uv run dvc remote modify origin --local access_key_id "$DAGSHUB_TOKEN"
          uv run dvc remote modify origin --local secret_access_key "$DAGSHUB_TOKEN"

      - name: Pull training data
        run: uv run dvc pull

      - name: Train model and log to MLflow
        run: uv run wine_quality_training.py rf_baseline
